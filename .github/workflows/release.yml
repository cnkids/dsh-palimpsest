name: Release

# 推 v* tag 即自动：校验版本 → 跑测试 → 发布 npm（Trusted Publishing/OIDC，无需 token）
# → 建 Release 并上传 .tgz。
# 前置（只需做一次）：在 npmjs.com 上为本仓库配置 Trusted Publisher。
#
# 安全审计 F3 的硬化（本文件即修复结果）：
#   - 构建与发布拆成两个 job，`id-token: write` 只给发布 job —— 否则连
#     `npm install -g npm@latest` 这一步都能申请到可发布 npm 的 OIDC token。
#   - 发布 job 不引用受保护环境：审批门在 GitHub 侧故障时会直接卡死发布
#     （实测 required_reviewers 审批返回 500 且运行被取消）。与同类插件
#     dsh-office-toolkit 的成功形态保持一致 —— 发布靠 OIDC 短时令牌 + provenance。
#   - action 固定到 commit SHA（tag 是可变的）；checkout 不持久化凭据。
#   - npm 版本固定，依赖走 package-lock.json（npm ci）；构建期做依赖漏洞扫描。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 package.json $PKG 不一致"
            exit 1
          fi

      # lockfile 固定版本；不跑第三方生命周期脚本（本插件零运行时依赖，
      # 只需要 peer 依赖 @deepseek-ai/dsh-tools 供 smoke 测试 import 真实入口）
      - name: 安装依赖
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: 依赖漏洞扫描
        run: npm audit --audit-level=high

      - name: 测试
        run: npm test

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 建 Release 与上传附件
      id-token: write   # npm Trusted Publishing(OIDC) 必需，只授予这个 job
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing 要求 npm ≥ 11.5.1，runner 自带的偏旧；固定版本而不是 @latest
      - name: 升级 npm
        run: npm install -g npm@11.5.1

      - name: 安装依赖
        run: npm ci --ignore-scripts --no-audit --no-fund

      # 幂等：首次上传若是本地手发的，这里跳过而不是把整个 Release 卡死
      #
      # 注意：npm 已启用 Staged Publishing（暂存发布）。CI 的 npm publish 会把版本送进
      # 暂存区并返回成功（`+ pkg@x.y.z`），但**必须由维护者用 2FA 人工批准**才会上线
      # （`npm stage list` → `npm stage approve <stage-id>`，或在 npmjs.com 上批准）。
      # 这一步 CI 无法代替，看到 "being processed" 不等于已可用。
      - name: 发布到 npm
        run: |
          V="$(node -p "require('./package.json').version")"
          if npm view "dsh-palimpsest@$V" version >/dev/null 2>&1; then
            echo "npm 上已存在 $V，跳过发布"
          else
            npm publish --provenance --access public
          fi

      - name: 打包 tgz
        run: |
          V="$(node -p "require('./package.json').version")"
          npm pack
          cp "dsh-palimpsest-$V.tgz" dsh-palimpsest.tgz
          ls -la ./*.tgz

      # 仓库启用了 immutable releases：release 一旦正式发布就不能再补附件，
      # 原先「先 create 再 upload」会被拒：HTTP 422 Cannot upload assets to an immutable release。
      # 正确顺序：建 draft → 传附件 → 最后才 --draft=false 发布。
      #
      # 警告：**绝不要**为了补附件而删掉已发布的 release。immutable releases 会永久占用
      # 那个 tag 名，删除后再建只会得到 `tag_name was used by an immutable release`
      # （v0.2.0 就是这么丢掉公开 release 的）。所以这里已存在就原样跳过。
      - name: 建 Release 并上传附件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="$(node -p "require('./package.json').version")"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME 已存在，跳过（不删除：immutable tag 删了会永久锁死）"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            "dsh-palimpsest-$V.tgz" dsh-palimpsest.tgz
          gh release edit "$GITHUB_REF_NAME" --draft=false
