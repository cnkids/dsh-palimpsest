# SonarQube 分析配置。
# 注意：令牌绝不能写入本文件（会被提交），通过环境变量传入。
# 分支 / 版本 / token 由 scripts/sonar-check.sh 统一处理，请用它触发扫描：
#   ./scripts/sonar-check.sh          # 自动取当前 git 分支
#   ./scripts/sonar-check.sh main     # 显式指定分支
# 直接裸跑 sonar-scanner 且不带 sonar.branch.name 时，结果会写进项目主分支。

sonar.projectKey=dsh-palimpsest
sonar.projectName=dsh-palimpsest
sonar.host.url=https://so.rclandy.com
sonar.sourceEncoding=UTF-8

# 插件本体是 sources，用例单独归类，便于计算「新代码覆盖率」
sonar.sources=lib
sonar.tests=test
sonar.test.inclusions=test/**/*.test.mjs

# 由 npm run coverage 生成（Node 内置 test runner 的 lcov reporter）
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=node_modules/**,coverage/**,.scannerwork/**,test/e2e.patch.yml

# 分析后等待服务端算完门禁，让「门禁失败」直接体现为退出码
sonar.qualitygate.wait=true
